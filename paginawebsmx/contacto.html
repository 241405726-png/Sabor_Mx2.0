<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Sabor Mx</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="encabezado-simple">
        <nav class="navbar">
            <h1>Sabor Mx</h1>
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="menu.html">Menú</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contacto">
        <section class="formulario">
            <h2>Contáctanos</h2>
            <p>Completa el formulario para enviarnos un mensaje.</p>

            <form onsubmit="enviarFormulario(event)">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

                <label for="mensaje-form">Mensaje:</label>
                <textarea id="mensaje-form" name="mensaje" rows="5" placeholder="Escribe tu mensaje" required></textarea>

                <button type="submit" class="boton">Enviar mensaje</button>
            </form>

            <p id="respuesta"></p>
        </section>
    </main>

    <footer>
        <p> 2026 Sabor Mexicano | Proyecto escolar</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
